<style>
.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.contact{grid-template-columns:1fr}}
.form{display:grid;gap:14px;padding:26px;border-radius:28px;background:var(--glass-strong);border:1px solid var(--glass-line);box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.form label{display:grid;gap:6px;font-size:13px;font-weight:600}
.form input,.form textarea{font:500 16px var(--body);color:var(--fg);background:var(--glass);border:1px solid var(--glass-line);border-radius:14px;padding:12px 14px;width:100%}
.form textarea{min-height:130px;resize:vertical}
.send{justify-self:start;height:52px;padding:0 26px;border-radius:999px;border:0;background:var(--fg);color:var(--bg);font:700 15px var(--body);cursor:pointer;display:flex;align-items:center;gap:10px;transition:transform .2s}
.send:hover{transform:translateY(-2px)}
.msg{font-size:14px;padding:12px 14px;border-radius:14px;border:1.5px dashed var(--pink)}
.msg.ok{border-style:solid;border-color:#2BD67B}
.send[disabled]{opacity:.6;cursor:wait;transform:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.li{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:22px;text-decoration:none;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .25s}
.li:hover{transform:translateY(-4px)}
.li .badge{width:46px;height:46px;border-radius:12px;background:#0A66C2;color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:0 0 auto}
.li small{display:block;color:var(--muted);font-family:var(--mono);font-size:12px;word-break:break-all}
.orb-mini{width:min(220px,50vw);aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 30px 60px -26px rgba(241,6,143,.55)}
.orb-mini img{width:100%;height:100%}

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="assets/site.js?v=2"></script>
<script>
(() => {
  const form = document.getElementById('cform'), msg = document.getElementById('fmsg'), btn = form.querySelector('.send');
  const show = (text, ok) => { msg.textContent = text; msg.classList.toggle('ok', !!ok); msg.hidden = false; };
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!form.checkValidity()) {
      const bad = form.querySelector(':invalid');
      show(bad && bad.type === 'email' ? 'Please enter a valid email address.' : 'Please fill in your name, email and message.');
      if (bad) bad.focus();
      return;
    }
    btn.disabled = true; show('Sending…', true);
    try {
      const res = await fetch(form.action, {method: 'POST', headers: {'Accept': 'application/json'}, body: new FormData(form)});
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.success) { form.reset(); show('Thank you! Your message has been sent. I’ll get back to you soon.', true); }
      else show('Sorry, the message could not be sent. Please try again or reach me on LinkedIn.');
    } catch (err) {
      show('Sorry, the message could not be sent. Please check your connection and try again.');
    } finally { btn.disabled = false; }
  });
})();
</script>
